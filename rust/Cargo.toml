[package]
name = "tennessee-eastman"
version = "0.1.0"
edition = "2021"
license = "NCSA"
description = "Rust equivalent of the Tennessee Eastman Process Control Test Problem (Downs & Vogel / Braatz)"
readme = false
publish = false

[[bin]]
name = "temain"
path = "src/bin/temain.rs"

[[bin]]
name = "temain_mod"
path = "src/bin/temain_mod.rs"

[[bin]]
name = "te-console"
path = "src/bin/te_console.rs"

[[bin]]
name = "te-experiment"
path = "src/bin/te_experiment.rs"

[lib]
name = "tennessee_eastman"
path = "src/lib.rs"

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "0.6", features = ["cors", "fs", "set-header"] }
